name: Promote beta.19 account sync tester build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/promote_accountsync1.py"
      - ".github/workflows/promote-accountsync1.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build tester release
        run: python tools/promote_accountsync1.py

      - name: Commit tester release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-accountsync1.js index-accountsync1.pck shared/afb-cloud-accountsync1.js version.json BUILD_VERSION.txt RELEASE_NOTES_ACCOUNTSYNC1.txt ACCOUNTSYNC1_INTEGRITY.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Promote beta.19 account sync tester build"
          git push
