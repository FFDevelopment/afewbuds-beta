<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFewBuds Account Fix</title>
<style>body{margin:0;background:#07110b;color:#eef6ec;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.card{width:min(620px,100%);background:#121d16;border:1px solid #314538;border-radius:22px;padding:26px;box-shadow:0 24px 70px #0008}h1{margin:0 0 8px}.sub{color:#aab6aa;line-height:1.5}.ok{color:#a9d492}.bad{color:#ffab96}button{width:100%;min-height:50px;border:0;border-radius:12px;background:#8fc379;color:#0b150d;font-weight:800;font-size:16px;cursor:pointer;margin-top:12px}.note{font-size:13px;color:#899789;line-height:1.5;margin-top:16px}</style></head>
<body><main class="card"><h1>AFewBuds account hotfix</h1><p class="sub">This clears only old AFewBuds web-cache files and service workers. It does not clear localStorage, IndexedDB, or Godot save data.</p><p id="state">Ready.</p><button id="repair">Repair browser cache and open AFewBuds</button><p class="note">Use this after the GitHub Pages deployment finishes. Do not use Safari's “Clear Website Data” option.</p></main>
<script>
const state=document.getElementById('state'),btn=document.getElementById('repair');
btn.onclick=async()=>{btn.disabled=true;state.className='';state.textContent='Checking the new build…';try{
 const res=await fetch('index.html?afb_accountfix1='+Date.now(),{cache:'no-store'}); const html=await res.text();
 if(!res.ok||!html.includes('AFewBuds 0.7.9-beta.16 Account Fix')||!html.includes('afb-login-form')) throw new Error('The new account-fix index.html is not live yet. Wait for GitHub Pages to finish deploying and try again.');
 state.textContent='Removing old AFewBuds caches…';
 if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope.includes('/afewbuds-beta/')).map(r=>r.unregister()));}
 if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('AFewBuds Beta v0-sw-cache-')||k.toLowerCase().includes('afewbuds')).map(k=>caches.delete(k)));}
 state.className='ok';state.textContent='Done. Your save storage was not touched. Opening AFewBuds…';
 setTimeout(()=>location.replace('index.html?afb_accountfix1='+Date.now()),700);
}catch(e){state.className='bad';state.textContent=e.message||String(e);btn.disabled=false;}};
</script></body></html>
