name: Smoke test cloud-test PCK
on:
  push:
    branches: [main]
    paths:
      - "cloud-test/index-accountsync10.pck"
      - ".github/workflows/smoke-cloud-test.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4
      - name: Boot cloud-test PCK headless
        run: |
          godot --headless --rendering-method gl_compatibility --path . --main-pack cloud-test/index-accountsync10.pck --quit-after 5 2>&1 | tee /tmp/godot.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Cannot open resource pack|Pack version unsupported" /tmp/godot.log
