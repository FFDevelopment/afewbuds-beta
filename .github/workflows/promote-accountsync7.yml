name: Promote beta.19 account sync 7 tester build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/promote_accountsync7.py"
      - ".github/workflows/promote-accountsync7.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build tester release
        run: python tools/promote_accountsync7.py

      - name: Commit tester release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-accountsync7.js index-accountsync7.pck shared/afb-cloud-accountsync7.js version.json BUILD_VERSION.txt RELEASE_NOTES_ACCOUNTSYNC7.txt ACCOUNTSYNC7_INTEGRITY.json admin/index.html shared/afb-api.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Promote beta.19 account sync 7 tester build"
          git pull --rebase origin main
          git push
