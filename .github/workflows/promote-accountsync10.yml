name: Promote beta.19 account sync 10 tester build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/promote_accountsync10.py"
      - ".github/workflows/promote-accountsync10.yml"
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build tester release
        run: python tools/promote_accountsync10.py
      - name: Commit tester release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-accountsync10.js index-accountsync10.pck shared/afb-cloud-accountsync10.js version.json BUILD_VERSION.txt RELEASE_NOTES_ACCOUNTSYNC10.txt ACCOUNTSYNC10_INTEGRITY.json
          git commit -m "Promote beta.19 account sync 10 tester build"
          git pull --rebase origin main
          git push
