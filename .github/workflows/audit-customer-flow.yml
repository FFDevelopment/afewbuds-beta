name: Audit AFewBuds customer flow

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/audit_customer_flow.py"
      - ".github/workflows/audit-customer-flow.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit packed customer flow
        run: python tools/audit_customer_flow.py
