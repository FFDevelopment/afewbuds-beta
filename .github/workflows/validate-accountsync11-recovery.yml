name: Validate accountsync11 recovery endpoint
on:
  push:
    branches: [accountsync11-release]
    paths:
      - ".github/workflows/validate-accountsync11-recovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test public recovery endpoint without sending email
        shell: python
        run: |
          import json, urllib.request
          url="https://nlrrnhdcjrnfuftyoaqn.supabase.co/functions/v1/afb-password-reset"
          payload=json.dumps({
              "username":"__afb_nonexistent_account_validation__",
              "return_url":"https://ffdevelopment.github.io/afewbuds-beta/"
          }).encode()
          req=urllib.request.Request(
              url,
              data=payload,
              headers={"Content-Type":"application/json","User-Agent":"AFewBuds-release-validator"},
              method="POST"
          )
          with urllib.request.urlopen(req,timeout=30) as response:
              body=json.loads(response.read().decode())
          if body.get("ok") is not True:
              raise SystemExit("Recovery endpoint did not return generic success")
          msg=str(body.get("message",""))
          if "If that AFewBuds account has a recovery email" not in msg:
              raise SystemExit("Recovery endpoint returned unexpected response")
          print("Recovery endpoint validation passed.")
