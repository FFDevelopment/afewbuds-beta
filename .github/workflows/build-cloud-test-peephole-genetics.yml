name: Build cloud-test peephole genetics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/build_cloud_test_peephole_genetics.py"
      - "tools/peephole_remaining160.zip"
      - ".github/workflows/build-cloud-test-peephole-genetics.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build combined cloud test
        run: python tools/build_cloud_test_peephole_genetics.py
      - name: Commit combined cloud test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-test/index.html cloud-test/index-peephole-genetics2.pck cloud-test/TEST_BUILD.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build combined peephole and genetics cloud test"
          git pull --rebase origin main
          git push
