name: Smoke inventory cloud-test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud-test/index-accountsync10.pck"
      - ".github/workflows/smoke-inventory-cloud-test.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v4
      - name: Boot cloud-test PCK
        run: |
          set -o pipefail
          godot --headless --rendering-method gl_compatibility --path . --main-pack cloud-test/index-accountsync10.pck --quit-after 8 2>&1 | tee /tmp/godot.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|Cannot open resource pack|Pack version unsupported" /tmp/godot.log; then
            exit 1
          fi
