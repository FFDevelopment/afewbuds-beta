name: Build cloud-test peephole portraits

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/build_cloud_test_peephole.py"
      - "tools/peephole_assets96.zip"
      - ".github/workflows/build-cloud-test-peephole.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build accountsync10 peephole test
        run: python tools/build_cloud_test_peephole.py

      - name: Commit cloud-test build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-test/index.html cloud-test/index.js cloud-test/shared/afb-cloud.js cloud-test/index-peephole1.pck cloud-test/TEST_BUILD.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build accountsync10 peephole cloud test"
          git pull --rebase origin main
          git push
